services:
  client:
    image: node
    command: npm run dev
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - 5173:5173
    restart: always
  server:
    image: node
    command: npm run dev
    working_dir: /app
    volumes:
      - ./server:/app
    ports:
      - 3000:3000
